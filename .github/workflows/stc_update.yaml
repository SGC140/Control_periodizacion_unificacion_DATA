name: Boton Update Data STC to BQ

on:
    workflow_dispatch:

jobs:
    pipeline-engineering:
        runs-on: ubuntu-latest

        steps:
        - name: Descargar Repositorio
          uses: actions/checkout@v4

        - name: Configuracion v. Python 3.14
          uses:  actions/setup-python@v5
          with:
            python-version: '3.14'
            cache: 'pip'
        
        - name: Requirements
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        
        - name: Credenciales
          env:
            CREDENCIALES_JSON: ${{secrets.CREDENCIALES_GCP}}
            CLIENT_SECRETS_JSON: ${{secrets.CLIENT_SECRETS_JSON}}
            CREDENTIAL_MODULE_JSON: ${{secrets.CREDENTIAL_MODULE_JSON}}
            VARIABLES_ENTORNO: ${{secrets.ARCHIVO_ENV}}
          run: |
            echo "$CREDENCIALES_JSON" > credenciales.json
            echo "$VARIABLES_ENTORNO" > .env
            echo "$CLIENT_SECRETS_JSON" > client_secrets.json
            echo "$CREDENTIAL_MODULE_JSON" > credentials_module.json

        - name: Actualizacion STC at BQ
          run: python Upload_STC_3_0.py
